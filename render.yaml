services:
  - type: web
    name: match-decoded-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: WATSONX_API_KEY
        sync: false
      - key: WATSONX_PROJECT_ID
        sync: false
      - key: WATSONX_URL
        value: "https://us-south.ml.cloud.ibm.com"
      - key: PYTHON_VERSION
        value: "3.11.9"
